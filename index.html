<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy New Year 🎉</title>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient( circle at top, #0a0a28, #000 );
    font-family: "Poppins", system-ui, sans-serif;
    overflow: hidden;
    color: #fff;
  }

  .container {
    text-align: center;
    padding: 20px 30px;
    border-radius: 24px;
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 25px rgba(255,255,255,0.15);
  }

  h1 {
    font-size: 3rem;
    margin: 0 0 10px;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #ffd700, 0 0 25px #ff8c00;
  }

  p {
    margin: 8px 0 18px;
    font-size: 1.1rem;
    opacity: .9;
  }

  .name {
    color: #ffd700;
    font-weight: 700;
  }

  button {
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: .95rem;
    background: linear-gradient(135deg, #ff8c00, #ffd700);
    box-shadow: 0 8px 18px rgba(255, 193, 7, .45);
  }

  button:hover { transform: translateY(-1px) scale(1.02); }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 14px;
    background: #fff;
    top: -20px;
    opacity: .9;
    border-radius: 2px;
    animation: fall 4s linear infinite;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
    }
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2.5s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: .2; }
    to   { opacity: 1;  box-shadow: 0 0 8px white; }
  }
</style>
</head>

<body>
<div class="container">
  <h1>🎆 Happy New Year 🎆</h1>
  <p>Wishing you joy, success, and amazing memories in <span id="year"></span>!</p>

  <p>From: <span class="name">Your Friend</span></p>

  <button onclick="alert('Have an awesome year ahead! 🎉')">
    Send Good Vibes ✨
  </button>
</div>

<script>
  // Set current year
  document.getElementById("year").textContent = new Date().getFullYear();

  // Create stars
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top  = Math.random() * 100 + "vh";
    s.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(s);
  }

  // Create confetti
  for (let i = 0; i < 60; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDelay = Math.random() * 4 + "s";
    c.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    document.body.appendChild(c);
  }
</script>
</body>
</html>
