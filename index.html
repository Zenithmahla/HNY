<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Year Wishes — Zenith</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.wrapper{
  width:95%;
  max-width:900px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  box-shadow:0 0 25px rgba(255,255,255,.15);
}

h1{margin-top:0;text-align:center;text-shadow:0 0 20px gold;}
.small{opacity:.9;font-size:.9rem;text-align:center;margin-bottom:10px}

input,select{
  width:100%;padding:10px;border-radius:25px;border:none;
  outline:none;margin:7px 0;
}

button{
  padding:10px 16px;border-radius:25px;border:none;
  cursor:pointer;font-weight:600;
  background:linear-gradient(135deg,#ff8c00,#ffd700);
  box-shadow:0 10px 20px rgba(255,193,7,.45);
}

.flex{display:flex;gap:8px;flex-wrap:wrap}
.center{text-align:center}

/* shayari */
.shayari{margin-top:12px;white-space:pre-line;opacity:0}
.shayari.show{animation:fade .6s ease forwards}
@keyframes fade{to{opacity:1}}

.signature{margin-top:10px;font-style:italic;opacity:.8}
.love{margin-top:6px;font-size:.9rem}

/* stats panel */
#statsList{
  max-height:280px;
  overflow:auto;
  margin-top:8px;
}
.statRow{
  background:rgba(255,255,255,.07);
  border-radius:12px;
  padding:8px 10px;
  margin-bottom:6px;
}
.bar{
  height:7px;border-radius:7px;
  background:linear-gradient(90deg,#ffd700,#ff7f00);
}
.label{font-size:.85rem;display:flex;justify-content:space-between;margin-bottom:4px}

/* fireworks */
.firework{
  position:absolute;border-radius:50%;
  mix-blend:screen;pointer-events:none;
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- WISH CARD -->
  <div class="card">
    <h1>🎆 Happy New Year 🎆</h1>
    <div class="small" id="countdown"></div>

    <input id="nameInput" placeholder="Friend name..." />
    <select id="category">
      <option value="friends">Friends ❤️</option>
      <option value="family">Family 👨‍👩‍👧‍👦</option>
      <option value="love">Love 💖</option>
    </select>

    <div class="center">
      <button onclick="generate()">Create Wish ✨</button>
      <button onclick="shareWhatsApp()">Share 📲</button>
      <button onclick="openGame()">Game ⭐</button>
    </div>

    <div class="shayari" id="shayariBox"></div>
    <div class="love" id="loveLevel"></div>
    <div class="signature" id="fromBox"></div>
  </div>

  <!-- STATS / LOVE LOG -->
  <div class="card">
    <h3>💖 Friends & Love Stats</h3>
    <p style="opacity:.9;font-size:.85rem">
      Every time someone enters their name, it is saved here automatically.
      You can also adjust how much they love/like you.
    </p>

    <div id="statsList"></div>
  </div>

</div>

<!-- GAME POPUP -->
<div id="gameModal" style="display:none;position:fixed;inset:0;background:#000000cc;align-items:center;justify-content:center;z-index:50">
  <div class="card" style="max-width:420px;width:95%;text-align:center">
    <h3>⭐ Catch the Stars</h3>
    <div id="gameArea" style="height:250px;background:#020617;border-radius:14px;position:relative;overflow:hidden;margin-bottom:6px"></div>
    <div id="scoreBox">Score: 0</div>
    <div id="leaderboard" style="text-align:left;font-size:.85rem;max-height:120px;overflow:auto;margin-top:8px"></div>
    <div class="flex center">
      <button onclick="startGame()">Start</button>
      <button onclick="closeGame()">Close</button>
    </div>
  </div>
</div>

<!-- background music -->
<audio id="bgMusic" loop autoplay volume="0.3">
  <source src="https://cdn.pixabay.com/download/audio/2023/01/07/audio_4ce1a45cae.mp3?filename=soft-piano-129777.mp3" type="audio/mpeg"/>
</audio>

<script>
// ---- SHAYARI ----
const data={
friends:[
`{name}, dosti ka rishta har saal aur gehra ho jaaye,
Khushiyon ka har pal tumhare naam ho jaaye 💫`,
`{name}, tumhari muskurahat meri dua hai,
Iss naye saal mein humari dosti aur khaas ho jaaye ❤️`
],
family:[
`{name}, rab tumhari zindagi ko barkat se bhar de,
Ghar hamesha pyaar se roshan rahe 💕`,
`{name}, har subah sukoon, har shaam khushi,
Naya saal tumhari family ke liye meetha ho 💖`
],
love:[
`{name}, har dhadkan ek naya sapna ban kar aaye,
Aur naya saal sirf pyaar laaye 💘`,
`{name}, hamari kahani aur khoobsurat ho,
Aur har dua bas tum par thehar jaaye 💞`
]
};

let lastMessage="";
function generate(){
  const name=document.getElementById("nameInput").value.trim();
  if(!name){alert("Enter a name 🙂");return;}
  const cat=document.getElementById("category").value;
  const t=data[cat][Math.floor(Math.random()*data[cat].length)]
    .replaceAll("{name}",name);

  const box=document.getElementById("shayariBox");
  box.classList.remove("show");
  box.innerText=t;
  setTimeout(()=>box.classList.add("show"),10);

  // love % always 60–100
  const love=60+Math.floor(Math.random()*41);
  document.getElementById("loveLevel").innerText =
    `❤️ Love level: ${love}%`;
  document.getElementById("fromBox").innerText =
    "— With love, Zenith Mahla";

  lastMessage = `${t}\nLove level: ${love}%\n— With love, Zenith Mahla`;

  // save entry
  saveEntry({name,category:cat,love});
  renderStats();
  spawnFirework(18);
}

// ---- COUNTDOWN ----
function countdown(){
  const next=new Date(new Date().getFullYear()+1,0,1);
  const diff=next-new Date();
  const d=Math.floor(diff/86400000),
        h=Math.floor(diff/3600000)%24,
        m=Math.floor(diff/60000)%60,
        s=Math.floor(diff/1000)%60;
  document.getElementById("countdown").innerText=
   `New Year in: ${d}d ${h}h ${m}m ${s}s`;
}
setInterval(countdown,1000);

// ---- SHARE ----
function shareWhatsApp(){
  if(!lastMessage){alert("Create a wish first 🙂");return;}
  window.open("https://wa.me/?text="+encodeURIComponent(lastMessage),"_blank");
}

// ---- STORAGE: RECORD EVERY ENTRY ----
function getEntries(){
  return JSON.parse(localStorage.getItem("ny_entries")||"[]");
}
function saveEntry(e){
  const list=getEntries();
  list.push({...e,time:Date.now()});
  localStorage.setItem("ny_entries",JSON.stringify(list));
}
function updateLove(index,newVal){
  const list=getEntries();
  list[index].love=newVal;
  localStorage.setItem("ny_entries",JSON.stringify(list));
  renderStats();
}

// render stats list
function renderStats(){
  const list=getEntries();
  const box=document.getElementById("statsList");
  if(!list.length){box.innerHTML="No entries yet.";return;}

  box.innerHTML=list
    .slice()  // copy
    .reverse() // newest first
    .map((e,i)=>{
      const idx=list.length-1-i;
      return `
      <div class="statRow">
        <div class="label">
          <span><b>${e.name}</b> — ${e.category}</span>
          <span>${e.love}%</span>
        </div>
        <div class="bar" style="width:${e.love}%"></div>
        <input type="range" min="50" max="100" value="${e.love}"
          oninput="updateLove(${idx},this.value)" />
      </div>`;
    }).join("");
}
renderStats();

// ---- FIREWORKS ----
function spawnFirework(boost=0){
  const f=document.createElement("div");
  f.className="firework";
  const size=(Math.random()*10+6)+boost;
  f.style.width=f.style.height=size+"px";
  f.style.left=Math.random()*100+"vw";
  f.style.top=Math.random()*100+"vh";
  f.style.background=`hsl(${Math.random()*360},100%,60%)`;
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1100);
}
setInterval(()=>spawnFirework(),250);

// ---- GAME ----
const gameModal=document.getElementById("gameModal");
const gameArea=document.getElementById("gameArea");
let running=false,spawn=null,score=0,speed=30;

function openGame(){gameModal.style.display="flex";loadBoard();}
function closeGame(){gameModal.style.display="none";stopGame();}
function startGame(){
  stopGame();score=0;speed=30;
  document.getElementById("scoreBox").innerText="Score: 0";
  running=true;
  spawn=setInterval(()=>running&&spawnStar(),800);
}
function stopGame(){running=false;clearInterval(spawn);gameArea.innerHTML="";}

function spawnStar(){
  const star=document.createElement("div");
  star.style.cssText="position:absolute;width:22px;height:22px;border-radius:50%;background:gold;box-shadow:0 0 10px gold;left:"+Math.random()*90+"%;top:-25px";
  let y=-25;
  const fall=setInterval(()=>{
    if(!running)return clearInterval(fall);
    y+=(score>15?6:score>8?5:4);
    star.style.top=y+"px";
    if(y>230){clearInterval(fall);star.remove();gameOver();}
  },speed);

  star.onclick=()=>{
    score++;document.getElementById("scoreBox").innerText="Score: "+score;
    clearInterval(fall);star.remove();
    if(score%5===0){speed=Math.max(14,speed-2);spawnFirework(22);}
    else spawnFirework(10);
  };
  gameArea.appendChild(star);
}

function gameOver(){
  running=false;clearInterval(spawn);
  alert("Game Over! Score: "+score);
  saveScore(score);gameArea.innerHTML="";
}

function saveScore(s){
  const list=JSON.parse(localStorage.getItem("ny_board")||"[]");
  list.push(s);localStorage.setItem("ny_board",JSON.stringify(list));
  loadBoard();
}
function loadBoard(){
  const list=JSON.parse(localStorage.getItem("ny_board")||"[]")
               .sort((a,b)=>b-a).slice(0,5);
  document.getElementById("leaderboard").innerHTML =
    "<b>🏆 Leaderboard</b><br>"+
    (list.length?list.map((s,i)=>`${i+1}. ${s}`).join("<br>")
                :"No scores yet.");
}
</script>

</body>
</html>
